name: Publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Optional semantic-version bump
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      exact_version:
        description: Optional exact version, for example 0.2.0 (requires bump=none)
        required: false
        default: ""
        type: string
      release_type:
        description: Release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      publish_curseforge:
        description: Upload the release archive to CurseForge
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri
          python -m pip install --disable-pip-version-check Pillow

      - name: Check CurseForge configuration
        if: inputs.publish_curseforge
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MINECRAFT_VERSIONS: ${{ vars.MINECRAFT_VERSIONS }}
        run: |
          [[ -n "$CURSEFORGE_PROJECT_ID" ]] || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID." >&2
            exit 1
          }
          [[ -n "$CURSEFORGE_TOKEN" ]] || {
            echo "Missing repository secret CURSEFORGE_TOKEN." >&2
            exit 1
          }
          [[ -n "$MINECRAFT_VERSIONS" ]] || {
            echo "Missing repository variable MINECRAFT_VERSIONS." >&2
            exit 1
          }

      - name: Audit shader pack
        run: python tools/audit_pack.py

      - name: Validate default shader programs
        run: python tools/validate_glsl.py

      - name: Validate quality profiles
        run: python tools/validate_profiles.py

      - name: Resolve release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.exact_version }}
        run: |
          python tools/release_version.py \
            --bump "$BUMP" \
            --version "$EXACT_VERSION"

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version to v${VERSION}"
          gh auth setup-git
          git push origin HEAD:main

      - name: Capture release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release archive and changelog
        id: package
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          asset="dist/vibe-shader-v${VERSION}.zip"
          checksum="${asset}.sha256"

          zip -q -9 -r "$asset" shaders pack.png LICENSE
          unzip -Z1 "$asset" | grep -Fxq "shaders/shaders.properties"
          unzip -Z1 "$asset" | grep -Fxq "pack.png"
          sha256sum "$asset" > "$checksum"

          previous_tag="$({
            git tag --merged "$RELEASE_COMMIT" --sort=-version:refname \
              | grep -Fxv "$TAG" \
              | head -n 1
          } || true)"

          if [[ -n "$previous_tag" ]]; then
            {
              printf '# vibe-shader v%s\n\n' "$VERSION"
              printf '## Changes\n\n'
              git log --no-merges --pretty='- %s (%h)' \
                "${previous_tag}..${RELEASE_COMMIT}"
            } > dist/changelog.md
          else
            cp PATCH_NOTES.md dist/changelog.md
          fi

          {
            echo "asset=$asset"
            echo "checksum=$checksum"
            echo "changelog=dist/changelog.md"
          } >> "$GITHUB_OUTPUT"

      - name: Verify or create GitHub release
        env:
          ASSET: ${{ steps.package.outputs.asset }}
          CHANGELOG: ${{ steps.package.outputs.changelog }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo "$TAG already points to $tag_commit, not $RELEASE_COMMIT." >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TYPE" != "release" ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$TAG" "$ASSET" "$CHECKSUM" \
              --target "$RELEASE_COMMIT" \
              --title "vibe-shader v${VERSION}" \
              --notes-file "$CHANGELOG" \
              "${prerelease[@]}"
          fi

      - name: Publish to CurseForge
        if: inputs.publish_curseforge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.package.outputs.asset }}
          name: vibe-shader v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: ${{ steps.package.outputs.changelog }}
          loaders: |
            iris
            optifine
          environment: client
          game-versions: ${{ vars.MINECRAFT_VERSIONS }}
          game-version-filter: none
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

      - name: Write release summary
        env:
          ASSET: ${{ steps.package.outputs.asset }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Published $TAG"
            echo
            echo "- GitHub release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
            echo "- Archive: \`$(basename "$ASSET")\`"
            echo "- CurseForge requested: \`$PUBLISH_CURSEFORGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
