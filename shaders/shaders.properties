# vibe-shader — Iris / OptiFine shader configuration

iris.features.optional = BLOCK_EMISSION_ATTRIBUTE ENTITY_TRANSLUCENT PER_BUFFER_BLENDING CAN_DISABLE_WEATHER

screen = <empty> <profile> <empty> [LIGHTING] [ATMOSPHERE] [WATER] [POST] [ANIMATION]
screen.columns = 3
screen.LIGHTING = SHADOW_QUALITY SHADOW_DISTANCE SSAO_ENABLED VOLUMETRIC_LIGHTING EMISSIVE_ORES BLOCK_EDGE_ACCENT EDGE_STRENGTH
screen.ATMOSPHERE = CLOUD_QUALITY CLOUD_COVERAGE AURORA_ENABLED RAIN_EFFECTS
screen.WATER = WATER_QUALITY SSR_QUALITY WATER_OPACITY WAVING_WATER
screen.POST = TAA_ENABLED MOTION_STABILITY FXAA_ENABLED BLOOM_ENABLED BLOOM_STRENGTH TONEMAP_EXPOSURE COLOR_GRADE FILMIC_GRAIN
screen.ANIMATION = WAVING_FOLIAGE WAVING_WATER
screen.LIGHTING.columns = 2
screen.ATMOSPHERE.columns = 2
screen.WATER.columns = 2
screen.POST.columns = 2
screen.ANIMATION.columns = 2

sliders = SHADOW_DISTANCE CLOUD_COVERAGE BLOOM_STRENGTH WATER_OPACITY EDGE_STRENGTH TONEMAP_EXPOSURE MOTION_STABILITY

profile.LOW = SHADOW_QUALITY=1 SHADOW_DISTANCE=96.0 CLOUD_QUALITY=1 WATER_QUALITY=1 SSR_QUALITY=0 !SSAO_ENABLED !VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED !AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES !BLOCK_EDGE_ACCENT !FILMIC_GRAIN BLOOM_STRENGTH=0.50
profile.MEDIUM = SHADOW_QUALITY=2 SHADOW_DISTANCE=128.0 CLOUD_QUALITY=1 WATER_QUALITY=2 SSR_QUALITY=1 SSAO_ENABLED VOLUMETRIC_LIGHTING TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT !FILMIC_GRAIN BLOOM_STRENGTH=0.65
profile.HIGH = SHADOW_QUALITY=2 SHADOW_DISTANCE=160.0 CLOUD_QUALITY=2 WATER_QUALITY=2 SSR_QUALITY=2 SSAO_ENABLED VOLUMETRIC_LIGHTING TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT FILMIC_GRAIN BLOOM_STRENGTH=0.85
profile.CINEMATIC = SHADOW_QUALITY=3 SHADOW_DISTANCE=224.0 CLOUD_QUALITY=3 WATER_QUALITY=3 SSR_QUALITY=3 SSAO_ENABLED VOLUMETRIC_LIGHTING TAA_ENABLED !FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT FILMIC_GRAIN BLOOM_STRENGTH=1.20 MOTION_STABILITY=0.90

oldHandLight = false
oldLighting = false
separateAo = true
separateEntityDraws = true
particles.ordering = mixed
particles.before.deferred = false
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadow.culling = true
rain.depth = false
beacon.beam.depth = true
underwaterOverlay = false
sky = false
weather = false true
sun = false
moon = false
stars = false
clouds = off
vignette = false

# Preserve the accumulated TAA history in colortex6.
flip.deferred.colortex6 = false
flip.composite.colortex6 = true

# Water writes metadata without blending while its visible layer blends into the HDR scene.
blend.gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex4 = off
blend.world0/gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_water.colortex4 = off
blend.world-1/gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_water.colortex4 = off
blend.world1/gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_water.colortex4 = off

# Post-deferred translucent geometry is forward blended into the HDR scene.
blend.gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_lightning.colortex0 = SRC_ALPHA ONE ONE ONE ONE

# Mirror translucent blend policy for legacy world folders.

# world0
blend.world0/gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world0/gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world0/gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world0/gbuffers_lightning.colortex0 = SRC_ALPHA ONE ONE ONE ONE

# world-1
blend.world-1/gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world-1/gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world-1/gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world-1/gbuffers_lightning.colortex0 = SRC_ALPHA ONE ONE ONE ONE

# world1
blend.world1/gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world1/gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.world1/gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
