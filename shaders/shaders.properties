# vibe-shader — Iris / OptiFine shader configuration

iris.features.optional = BLOCK_EMISSION_ATTRIBUTE ENTITY_TRANSLUCENT PER_BUFFER_BLENDING CAN_DISABLE_WEATHER

screen = <empty> <profile> <empty> [VIBE] [PHENOMENA] [VISION] [LIGHTING] [ATMOSPHERE] [WATER] [POST] [ANIMATION]
screen.columns = 3
screen.VIBE = VIBE_MODE VIBE_INTENSITY TWILIGHT_BOOST
screen.VISION = DISTANT_BLUR VISION_FOCUS_DISTANCE DISTANT_BLUR_STRENGTH OCULAR_ASTIGMATISM ASTIGMATISM_STRENGTH SURVIVAL_VISION SURVIVAL_EFFECT_STRENGTH
screen.LIGHTING = SHADOW_QUALITY SHADOW_DISTANCE SSAO_ENABLED VOLUMETRIC_LIGHTING EMISSIVE_ORES NATURAL_TERRAIN_COHESION TERRAIN_COHESION_STRENGTH MATERIAL_DETAIL MATERIAL_DETAIL_STRENGTH ROUNDED_VOXEL_LIGHTING VOXEL_ROUNDNESS
screen.ATMOSPHERE = CLOUD_QUALITY CLOUD_COVERAGE ATMOSPHERE_DENSITY AURORA_ENABLED RAIN_EFFECTS
screen.WATER = WATER_QUALITY SSR_QUALITY WATER_OPACITY WATER_CLARITY WAVING_WATER
screen.POST = TAA_ENABLED MOTION_STABILITY FXAA_ENABLED BLOOM_ENABLED BLOOM_STRENGTH TONEMAP_EXPOSURE
screen.ANIMATION = WAVING_FOLIAGE WAVING_WATER
screen.PHENOMENA = CELESTIAL_QUALITY CELESTIAL_STRENGTH TIDAL_GLOW PHENOMENA_SPEED
screen.PHENOMENA.columns = 2
screen.VIBE.columns = 2
screen.VISION.columns = 2
screen.LIGHTING.columns = 2
screen.ATMOSPHERE.columns = 2
screen.WATER.columns = 2
screen.POST.columns = 2
screen.ANIMATION.columns = 2

sliders = CELESTIAL_STRENGTH TIDAL_GLOW PHENOMENA_SPEED SHADOW_DISTANCE VIBE_INTENSITY TWILIGHT_BOOST VISION_FOCUS_DISTANCE DISTANT_BLUR_STRENGTH ASTIGMATISM_STRENGTH SURVIVAL_EFFECT_STRENGTH TERRAIN_COHESION_STRENGTH MATERIAL_DETAIL_STRENGTH VOXEL_ROUNDNESS CLOUD_COVERAGE ATMOSPHERE_DENSITY BLOOM_STRENGTH WATER_OPACITY WATER_CLARITY TONEMAP_EXPOSURE MOTION_STABILITY

profile.LOW = CELESTIAL_QUALITY=1 CELESTIAL_STRENGTH=0.60 TIDAL_GLOW=0.00 PHENOMENA_SPEED=0.35 SHADOW_QUALITY=1 SHADOW_DISTANCE=96.0 CLOUD_QUALITY=1 WATER_QUALITY=1 SSR_QUALITY=0 VIBE_MODE=4 VIBE_INTENSITY=0.75 ATMOSPHERE_DENSITY=0.68 !SSAO_ENABLED !VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED DISTANT_BLUR OCULAR_ASTIGMATISM SURVIVAL_VISION !AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER !EMISSIVE_ORES NATURAL_TERRAIN_COHESION !MATERIAL_DETAIL !ROUNDED_VOXEL_LIGHTING BLOOM_STRENGTH=0.25 TERRAIN_COHESION_STRENGTH=0.50 MATERIAL_DETAIL_STRENGTH=0.30 VOXEL_ROUNDNESS=0.20 VISION_FOCUS_DISTANCE=80.0 DISTANT_BLUR_STRENGTH=0.32 ASTIGMATISM_STRENGTH=0.12 SURVIVAL_EFFECT_STRENGTH=0.62
profile.MEDIUM = CELESTIAL_QUALITY=1 CELESTIAL_STRENGTH=0.85 TIDAL_GLOW=0.35 PHENOMENA_SPEED=0.35 SHADOW_QUALITY=2 SHADOW_DISTANCE=128.0 CLOUD_QUALITY=1 WATER_QUALITY=2 SSR_QUALITY=1 VIBE_MODE=4 VIBE_INTENSITY=0.90 ATMOSPHERE_DENSITY=0.68 SSAO_ENABLED VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED DISTANT_BLUR OCULAR_ASTIGMATISM SURVIVAL_VISION AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER !EMISSIVE_ORES NATURAL_TERRAIN_COHESION MATERIAL_DETAIL ROUNDED_VOXEL_LIGHTING BLOOM_STRENGTH=0.40 TERRAIN_COHESION_STRENGTH=0.65 MATERIAL_DETAIL_STRENGTH=0.45 VOXEL_ROUNDNESS=0.30 VISION_FOCUS_DISTANCE=72.0 DISTANT_BLUR_STRENGTH=0.42 ASTIGMATISM_STRENGTH=0.17 SURVIVAL_EFFECT_STRENGTH=0.68
profile.HIGH = CELESTIAL_QUALITY=2 CELESTIAL_STRENGTH=0.85 TIDAL_GLOW=0.65 PHENOMENA_SPEED=0.35 SHADOW_QUALITY=2 SHADOW_DISTANCE=160.0 CLOUD_QUALITY=2 WATER_QUALITY=2 SSR_QUALITY=2 VIBE_MODE=4 VIBE_INTENSITY=1.10 ATMOSPHERE_DENSITY=0.82 SSAO_ENABLED VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED DISTANT_BLUR OCULAR_ASTIGMATISM SURVIVAL_VISION AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER !EMISSIVE_ORES NATURAL_TERRAIN_COHESION MATERIAL_DETAIL ROUNDED_VOXEL_LIGHTING BLOOM_STRENGTH=0.40 TERRAIN_COHESION_STRENGTH=0.78 MATERIAL_DETAIL_STRENGTH=0.70 VOXEL_ROUNDNESS=0.40 VISION_FOCUS_DISTANCE=64.0 DISTANT_BLUR_STRENGTH=0.52 ASTIGMATISM_STRENGTH=0.22 SURVIVAL_EFFECT_STRENGTH=0.72
profile.CINEMATIC = CELESTIAL_QUALITY=2 CELESTIAL_STRENGTH=1.00 TIDAL_GLOW=1.00 PHENOMENA_SPEED=0.35 SHADOW_QUALITY=3 SHADOW_DISTANCE=224.0 CLOUD_QUALITY=3 WATER_QUALITY=3 SSR_QUALITY=3 VIBE_MODE=4 VIBE_INTENSITY=1.30 ATMOSPHERE_DENSITY=1.00 SSAO_ENABLED VOLUMETRIC_LIGHTING TAA_ENABLED !FXAA_ENABLED BLOOM_ENABLED DISTANT_BLUR OCULAR_ASTIGMATISM SURVIVAL_VISION AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER !EMISSIVE_ORES NATURAL_TERRAIN_COHESION MATERIAL_DETAIL ROUNDED_VOXEL_LIGHTING BLOOM_STRENGTH=0.55 TERRAIN_COHESION_STRENGTH=0.90 MATERIAL_DETAIL_STRENGTH=0.85 VOXEL_ROUNDNESS=0.55 VISION_FOCUS_DISTANCE=56.0 DISTANT_BLUR_STRENGTH=0.62 ASTIGMATISM_STRENGTH=0.28 SURVIVAL_EFFECT_STRENGTH=0.78 MOTION_STABILITY=0.62

oldHandLight = false
oldLighting = false
separateAo = true
separateEntityDraws = true
particles.ordering = mixed
particles.before.deferred = false
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadow.culling = true
rain.depth = false
beacon.beam.depth = true
underwaterOverlay = false
sky = false
weather = false true
sun = false
moon = false
stars = false
clouds = off
vignette = false

# Optional TAA history. High keeps TAA disabled to avoid trails on water.
flip.deferred.colortex6 = false
flip.composite.colortex3 = true
flip.composite.colortex6 = true

# Keep the nearest surface in 4/7 and alpha-composite every layer in 3.
# Composite removes the nearest contribution before shading it once.
#ifdef IRIS_FEATURE_PER_BUFFER_BLENDING
blend.gbuffers_water.colortex4 = off
blend.gbuffers_water.colortex7 = off
blend.gbuffers_water.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Post-deferred translucent geometry is forward blended into the HDR scene.
blend.gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_lightning.colortex0 = SRC_ALPHA ONE ONE ONE ONE
#else
# Safe fallback for OpenGL 3.3 hardware without independent blend state.
# Water loses multi-layer accumulation, but the pack and settings still load.
blend.gbuffers_water = off
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_armor_glint = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_spidereyes = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_lightning = SRC_ALPHA ONE ONE ONE ONE
#endif
