# vibe-shader — Iris / OptiFine shader configuration

iris.features.optional = BLOCK_EMISSION_ATTRIBUTE ENTITY_TRANSLUCENT PER_BUFFER_BLENDING CAN_DISABLE_WEATHER

screen = <empty> <profile> <empty> [VIBE] [LIGHTING] [ATMOSPHERE] [WATER] [POST] [ANIMATION]
screen.columns = 3
screen.VIBE = VIBE_MODE VIBE_INTENSITY VIBE_PULSE PULSE_STRENGTH TWILIGHT_BOOST
screen.LIGHTING = SHADOW_QUALITY SHADOW_DISTANCE SSAO_ENABLED VOLUMETRIC_LIGHTING EMISSIVE_ORES BLOCK_EDGE_ACCENT EDGE_STRENGTH
screen.ATMOSPHERE = CLOUD_QUALITY CLOUD_COVERAGE ATMOSPHERE_DENSITY AURORA_ENABLED RAIN_EFFECTS
screen.WATER = WATER_QUALITY SSR_QUALITY WATER_OPACITY WATER_CLARITY WAVING_WATER
screen.POST = TAA_ENABLED MOTION_STABILITY FXAA_ENABLED BLOOM_ENABLED BLOOM_STRENGTH TONEMAP_EXPOSURE FILMIC_GRAIN
screen.ANIMATION = WAVING_FOLIAGE WAVING_WATER
screen.VIBE.columns = 2
screen.LIGHTING.columns = 2
screen.ATMOSPHERE.columns = 2
screen.WATER.columns = 2
screen.POST.columns = 2
screen.ANIMATION.columns = 2

sliders = SHADOW_DISTANCE VIBE_INTENSITY PULSE_STRENGTH TWILIGHT_BOOST CLOUD_COVERAGE ATMOSPHERE_DENSITY BLOOM_STRENGTH WATER_OPACITY WATER_CLARITY EDGE_STRENGTH TONEMAP_EXPOSURE MOTION_STABILITY

profile.LOW = SHADOW_QUALITY=1 SHADOW_DISTANCE=96.0 CLOUD_QUALITY=1 WATER_QUALITY=1 SSR_QUALITY=0 VIBE_MODE=2 VIBE_INTENSITY=0.75 ATMOSPHERE_DENSITY=0.55 !SSAO_ENABLED !VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED !AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT VIBE_PULSE !FILMIC_GRAIN BLOOM_STRENGTH=0.40 EDGE_STRENGTH=0.26
profile.MEDIUM = SHADOW_QUALITY=2 SHADOW_DISTANCE=128.0 CLOUD_QUALITY=1 WATER_QUALITY=2 SSR_QUALITY=1 VIBE_MODE=2 VIBE_INTENSITY=0.90 ATMOSPHERE_DENSITY=0.62 SSAO_ENABLED VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT VIBE_PULSE !FILMIC_GRAIN BLOOM_STRENGTH=0.62 EDGE_STRENGTH=0.30
profile.HIGH = SHADOW_QUALITY=2 SHADOW_DISTANCE=160.0 CLOUD_QUALITY=2 WATER_QUALITY=2 SSR_QUALITY=2 VIBE_MODE=2 VIBE_INTENSITY=0.90 ATMOSPHERE_DENSITY=0.68 SSAO_ENABLED VOLUMETRIC_LIGHTING !TAA_ENABLED FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT VIBE_PULSE FILMIC_GRAIN BLOOM_STRENGTH=0.78 EDGE_STRENGTH=0.34
profile.CINEMATIC = SHADOW_QUALITY=3 SHADOW_DISTANCE=224.0 CLOUD_QUALITY=3 WATER_QUALITY=3 SSR_QUALITY=3 VIBE_MODE=2 VIBE_INTENSITY=1.10 ATMOSPHERE_DENSITY=0.72 SSAO_ENABLED VOLUMETRIC_LIGHTING TAA_ENABLED !FXAA_ENABLED BLOOM_ENABLED AURORA_ENABLED RAIN_EFFECTS WAVING_FOLIAGE WAVING_WATER EMISSIVE_ORES BLOCK_EDGE_ACCENT VIBE_PULSE FILMIC_GRAIN BLOOM_STRENGTH=1.00 EDGE_STRENGTH=0.40 MOTION_STABILITY=0.62

oldHandLight = false
oldLighting = false
separateAo = true
separateEntityDraws = true
particles.ordering = mixed
particles.before.deferred = false
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadow.culling = true
rain.depth = false
beacon.beam.depth = true
underwaterOverlay = false
sky = false
weather = false true
sun = false
moon = false
stars = false
clouds = off
vignette = false

# Optional TAA history. High keeps TAA disabled to avoid trails on water.
flip.deferred.colortex6 = false
flip.composite.colortex3 = true
flip.composite.colortex6 = true

# Keep the nearest surface in 4/7 and alpha-composite every layer in 3.
# Composite removes the nearest contribution before shading it once.
blend.gbuffers_water.colortex4 = off
blend.gbuffers_water.colortex7 = off
blend.gbuffers_water.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Post-deferred translucent geometry is forward blended into the HDR scene.
blend.gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_armor_glint.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_spidereyes.colortex0 = SRC_ALPHA ONE ONE ONE ONE
blend.gbuffers_lightning.colortex0 = SRC_ALPHA ONE ONE ONE ONE
